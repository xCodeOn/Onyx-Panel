# Auto-release: on every push to main the workflow takes the panel version
# from the repo-root VERSION file, syncs the version literals across the
# installer/update scripts, and — when a v<version> tag does not exist yet —
# creates the tag and a GitHub Release with commit-list notes.
# Bump the version in the VERSION file -> push -> the release appears by itself.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.out.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version literals
        run: |
          # VERSION is the single source of truth. Rewrite every version
          # literal in the standalone scripts so a fresh install, update or
          # uninstall never shows or falls back to a stale number:
          #   update.sh               LOCAL_VERSION="…"
          #   install-*.sh            || echo '…'  fallback when the version file is absent
          #   install-panel.sh        Description=Onyx Panel …  (systemd unit)
          #   onyx_ui.py              VERSION = '…'  fallback for the version badge
          #   uninstall-onyx-panel.sh display strings
          # Each pattern is anchored so it matches exactly one kind of line.
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version in the VERSION file: '$VERSION'"
            exit 1
          fi
          sed -i "s/^LOCAL_VERSION=\"[0-9][0-9.]*\"/LOCAL_VERSION=\"$VERSION\"/" update.sh
          sed -i "s/|| echo '[0-9][0-9.]*'/|| echo '$VERSION'/" install-core.sh install-final.sh install-panel.sh
          sed -i "s/Description=Onyx Panel [0-9][0-9.]*/Description=Onyx Panel $VERSION/" install-panel.sh
          sed -i "s/^VERSION = '[0-9][0-9.]*'/VERSION = '$VERSION'/" onyx_ui.py
          sed -i "s/Onyx Panel [0-9][0-9.]*/Onyx Panel $VERSION/g" uninstall-onyx-panel.sh
          if git diff --quiet; then
            echo "Version literals already in sync with $VERSION."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync version literals to $VERSION [skip ci]"
            git push origin "$GITHUB_REF"
          fi

      - name: Detect version
        id: version
        run: |
          # The VERSION file is authoritative; parsing install-core.sh is
          # kept as a fallback for branches that predate the VERSION file.
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            VERSION="$(grep -oE "echo '[0-9]+\.[0-9]+\.[0-9]+'" install-core.sh | head -n1 | sed "s/echo '//;s/'//")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Cannot detect version (VERSION file or install-core.sh), got: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for f in update.sh install-core.sh install-final.sh install-panel.sh onyx_ui.py uninstall-onyx-panel.sh; do
            if ! grep -qF "$VERSION" "$f"; then
              echo "::error::Version mismatch: $f does not mention $VERSION."
              exit 1
            fi
          done

      - name: Skip if tag already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify committed component assets
        if: steps.check.outputs.skip == 'false'
        run: |
          # assets/ carries the prebuilt components inside the repo itself, so
          # the installer does not depend on the release attachments. They must
          # match the checksums the installers pin, or the strict checks die on
          # the user's server. The pins are read from the installer scripts so
          # this gate can never drift from what the server-side checks enforce.
          set -euo pipefail
          cd assets
          sha256sum -c SHA256SUMS
          TAR_SHA_PIN="$(grep -oE '^TPROXY_SOURCE_SHA256="[0-9a-f]{64}"' ../install-core.sh | cut -d'"' -f2)"
          [[ "$(gzip -dc tproxy-server-52a5feb.tar.gz | sha256sum | awk '{print $1}')" == "$TAR_SHA_PIN" ]] || {
            echo "::error::assets/tproxy-server-52a5feb.tar.gz tar-stream hash != TPROXY_SOURCE_SHA256 in install-core.sh"
            exit 1
          }
          XRAY_PIN="$(grep -oE '^XRAY_SHA256="[0-9a-f]{64}"' ../install-panel.sh | cut -d'"' -f2)"
          echo "$XRAY_PIN  Xray-linux-64.zip" | sha256sum -c -
          CADDY_PIN="$(grep -oE 'caddy_sha512="[0-9a-f]{128}"' ../install-core.sh | cut -d'"' -f2)"
          echo "$CADDY_PIN  caddy_2.11.4_linux_amd64.tar.gz" | sha512sum -c -
          MTPROTO_PIN="$(grep -oE '^MTPROTO_PROXY_SHA256="[0-9a-f]{64}"' ../install-core.sh | cut -d'"' -f2)"
          echo "$MTPROTO_PIN  mtproto-proxy-linux-amd64" | sha256sum -c -
          RELAY_PIN="$(grep -oE '^TPROXY_SERVER_SHA256="[0-9a-f]{64}"' ../install-core.sh | cut -d'"' -f2)"
          echo "$RELAY_PIN  tproxy-server-linux-amd64" | sha256sum -c -
          # The installer extracts the source tarball with --strip-components=1,
          # so the archive must carry the top-level prefix directory — a bare
          # `git archive` without --prefix dies on the completeness check.
          # grep -c reads the whole listing: no early-exit SIGPIPE under pipefail.
          [[ "$(tar -tzf tproxy-server-52a5feb.tar.gz | grep -c '^tproxy-server-52a5feb7fac38f68da5afef9cedd9b3bfc8473ca/deploy/install-mtproxy\.sh$')" -ge 1 ]] || {
            echo "::error::tproxy source tarball lacks the top-level prefix directory"
            exit 1
          }
          echo "Committed component assets verified."

      - name: Set released output
        id: out
        run: |
          if [[ "${{ steps.check.outputs.skip }}" == "false" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREV="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$' | sort -V | tail -n1)"
          if [[ -n "$PREV" && "$PREV" != "$TAG" ]]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Изменения"
            echo
            git log --no-decorate --format='- %s (%h)' $RANGE | grep -v 'chore: sync version literals'
          } > NOTES.md
          echo "----- release notes -----"
          cat NOTES.md
          echo "-------------------------"

      - name: Create tag and release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release Onyx Panel $VERSION"
          git push origin "refs/tags/v$VERSION"
          gh release create "v$VERSION" --title "Onyx Panel $VERSION" --notes-file NOTES.md
          echo "Release published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION"

  # Build the binaries that would otherwise be compiled on the user's server
  # (tproxy-server relay, MTProto proxy) and re-package the official Xray /
  # Caddy archives, then upload them all to the release as assets. The same
  # files are committed under assets/, so the bundle is a fallback for older
  # install.sh/update.sh versions and for releases predating the in-repo
  # assets. Pinned refs mirror the installer's constants.
  binaries:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev zlib1g-dev

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Prepare output directory
        run: mkdir -p /tmp/build

      - name: Build tproxy-server relay
        run: |
          git clone --quiet https://github.com/telegramdesktop/tproxy-server.git /tmp/tproxy
          git -C /tmp/tproxy checkout --quiet 52a5feb7fac38f68da5afef9cedd9b3bfc8473ca
          (cd /tmp/tproxy && go build -trimpath -ldflags='-s -w' \
            -o /tmp/build/tproxy-server-linux-amd64 ./cmd/tproxy-server)
          # The pinned source is bundled too so the installer never has to
          # fetch it from GitHub on the server (used by the MTProxy installer).
          # --prefix recreates the top-level directory the installer expects
          # (it extracts with --strip-components=1); gzip -n keeps the header
          # free of timestamps so the archive stays byte-identical across runs.
          git -C /tmp/tproxy archive \
            --prefix=tproxy-server-52a5feb7fac38f68da5afef9cedd9b3bfc8473ca/ \
            52a5feb7fac38f68da5afef9cedd9b3bfc8473ca | \
            gzip -9 -n > /tmp/build/tproxy-server-52a5feb.tar.gz

      - name: Compile-check MTProto proxy
        run: |
          # C builds are not byte-reproducible across runner toolchain updates
          # (gcc drift), so the fresh binary is a compile check only: the
          # bundle ships the committed, hash-pinned assets/ copy instead.
          git clone --quiet https://github.com/TelegramMessenger/MTProxy.git /tmp/MTProxy
          git -C /tmp/MTProxy checkout --quiet \
            f36d8af769ffaeac36978d38c2c0f6d1104c2137
          make -C /tmp/MTProxy -j"$(nproc)"
          test -x /tmp/MTProxy/objs/bin/mtproto-proxy

      - name: Fetch official Xray and Caddy archives
        run: |
          mkdir -p /tmp/build
          curl -fsSL -o /tmp/build/Xray-linux-64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip
          curl -fsSL -o /tmp/build/caddy_2.11.4_linux_amd64.tar.gz \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz

      - name: Compare fresh builds against committed assets
        run: |
          # The bundle must be byte-identical to the committed assets/: the
          # installer pins those hashes and dies on a mismatch. Strictly
          # compared: the reproducible artifacts (Go build, upstream archives,
          # deterministic tar stream). mtproto-proxy is a C build — see the
          # compile-check step for why it is not byte-compared.
          set -euo pipefail
          for f in tproxy-server-linux-amd64 Xray-linux-64.zip caddy_2.11.4_linux_amd64.tar.gz; do
            cmp "assets/$f" "/tmp/build/$f" || {
              echo "::error::$f built in CI differs from committed assets/$f — re-commit the CI artifact and update the pins in the same commit."
              exit 1
            }
          done
          # The source tarball is compared by uncompressed tar stream: git
          # archive of a fixed commit is deterministic.
          TAR_SHA_PIN="$(grep -oE '^TPROXY_SOURCE_SHA256="[0-9a-f]{64}"' install-core.sh | cut -d'"' -f2)"
          [[ "$(gzip -dc /tmp/build/tproxy-server-52a5feb.tar.gz | sha256sum | awk '{print $1}')" == "$TAR_SHA_PIN" ]] || {
            echo "::error::freshly archived tproxy source tar stream != TPROXY_SOURCE_SHA256"
            exit 1
          }

      - name: Package prebuilt bundle
        run: |
          cd /tmp/build
          # Ship the committed, hash-pinned MTProto binary: the installer pins
          # its sha256, and the C build is not byte-reproducible across runner
          # toolchains (the compile-check above guards the pinned source).
          cp "$GITHUB_WORKSPACE/assets/mtproto-proxy-linux-amd64" mtproto-proxy-linux-amd64
          sha256sum * > SHA256SUMS
          tar -czf "/tmp/onyx-binaries-${{ needs.release.outputs.version }}.tar.gz" *

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            /tmp/build/tproxy-server-linux-amd64 \
            /tmp/build/tproxy-server-52a5feb.tar.gz \
            /tmp/build/mtproto-proxy-linux-amd64 \
            /tmp/build/Xray-linux-64.zip \
            /tmp/build/caddy_2.11.4_linux_amd64.tar.gz \
            "/tmp/onyx-binaries-${{ needs.release.outputs.version }}.tar.gz" \
            --clobber
