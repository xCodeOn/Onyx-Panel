<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · Onyx Panel</title>
<link rel="stylesheet" href="assets/design.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 30px 18px; }
  .login-card { width: 100%; max-width: 420px; padding: 40px 36px 30px; text-align: center; }
  .login-logo { display: grid; place-items: center; margin-bottom: 22px; }
  .login-logo span { width: 62px; height: 62px; border-radius: 20px; background: var(--ink); display: grid; place-items: center; box-shadow: var(--shadow-2); }
  .login-card h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .login-card .sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 26px; }
  .login-card .field { text-align: left; margin-bottom: 14px; }
  .login-card .btn-primary { width: 100%; justify-content: center; padding: 13px; font-size: 14px; }
  .version { margin-top: 24px; font-size: 11px; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="card login-card">
  <div class="login-logo"><span><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c5.2 0 9.5 4.3 9.5 9.5s-4.3 9.5-9.5 9.5S2.5 17.2 2.5 12 6.8 2.5 12 2.5Z" stroke="#fff" stroke-width="1.6"/><path d="M12 7.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z" fill="#f05a1a"/></svg></span></div>
  <h1>Вход в панель</h1>
  <p class="sub">Управление подключениями и нодами</p>
  <form>
    <div class="field"><label for="u">Логин</label><input class="input" id="u" autocomplete="username" autofocus></div>
    <div class="field"><label for="p">Пароль</label><input class="input" id="p" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Продолжить</button>
  </form>
  <div class="version">Onyx Panel · 2.12.4</div>
</div>
</body>
</html>
