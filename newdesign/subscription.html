<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Моя подписка · Onyx</title>
<link rel="stylesheet" href="assets/design.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 34px 18px; }
  .sub-card { width: 100%; max-width: 860px; }
  .sub-hero { text-align: center; padding: 34px 24px 10px; }
  .sub-hero .page-title { font-size: 30px; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; padding: 20px 24px 26px; }
  .qr-card {
    background: var(--surface-soft); border: 1px solid var(--line-soft); border-radius: var(--r-md);
    padding: 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
    transition: transform .3s var(--ease-spring), box-shadow .3s var(--ease-spring);
  }
  .qr-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
  .qr-box { width: 148px; height: 148px; border-radius: 16px; background: #fff; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-soft); }
  .qr-box svg { width: 128px; height: 128px; }
  .qr-card h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; }
  .qr-card p { margin: -6px 0 0; }
  .usage { padding: 0 24px 8px; }
  .usage-bar { height: 8px; border-radius: 5px; background: var(--line-soft); overflow: hidden; margin-top: 10px; }
  .usage-bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
  .links-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 16px 24px 26px; }
</style>
</head>
<body>
<div class="card sub-card">
  <div class="sub-hero">
    <div class="eyebrow" style="justify-content:center"><span class="dot"></span>активна до 12 марта 2027</div>
    <h1 class="page-title">Мария, ваша подписка</h1>
    <p class="page-sub" style="margin-left:auto;margin-right:auto">Все протоколы в одном месте. Наведите камеру — клиент подхватит ключ сам.</p>
  </div>
  <div class="usage">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="stat-label">Трафик ноября</span>
      <span class="small"><span class="num"><b>8,2 ГБ</b></span> <span class="muted">из 50 ГБ</span></span>
    </div>
    <div class="usage-bar"><i style="width:16%"></i></div>
  </div>
  <div class="qr-grid">
    <div class="qr-card">
      <div class="qr-box"><svg viewBox="0 0 100 100" fill="#101418"><rect x="4" y="4" width="24" height="24" rx="3"/><rect x="72" y="4" width="24" height="24" rx="3"/><rect x="4" y="72" width="24" height="24" rx="3"/><rect x="10" y="10" width="12" height="12" fill="#fff" rx="1.5"/><rect x="78" y="10" width="12" height="12" fill="#fff" rx="1.5"/><rect x="10" y="78" width="12" height="12" fill="#fff" rx="1.5"/><path d="M38 8h6v6h-6zM50 8h4v4h-4zM60 8h6v6h-6zM38 20h4v4h-4zM8 38h6v6H6zM20 38h4v4h-4zM32 38h6v6h-6zM44 38h4v4h-4zM56 38h6v6h-6zM8 50h4v4H8zM20 50h6v6h-6zM38 50h6v6h-6zM50 50h4v4h-4zM62 50h6v6h-6zM74 38h4v4h-4zM86 38h6v6h-6zM74 50h4v4h-4zM38 62h4v4h-4zM50 62h6v6h-6zM62 62h4v4h-4zM74 62h6v6h-6zM38 74h6v6h-6zM56 74h4v4h-4zM68 74h6v6h-6zM38 86h4v6h-4zM50 86h6v6h-6zM62 86h4v4h-4zM74 86h4v4h-4zM86 74h6v6h-6zM86 50h6v6h-6z"/></svg></div>
      <h3>VLESS</h3>
      <p class="small muted">основной · быстрый</p>
      <button class="btn" style="padding:8px 15px;font-size:12.5px">Скопировать ключ</button>
    </div>
    <div class="qr-card">
      <div class="qr-box"><svg viewBox="0 0 100 100" fill="#101418"><rect x="4" y="4" width="24" height="24" rx="3"/><rect x="72" y="4" width="24" height="24" rx="3"/><rect x="4" y="72" width="24" height="24" rx="3"/><rect x="10" y="10" width="12" height="12" fill="#fff" rx="1.5"/><rect x="78" y="10" width="12" height="12" fill="#fff" rx="1.5"/><rect x="10" y="78" width="12" height="12" fill="#fff" rx="1.5"/><path d="M40 8h4v6h-4zM52 8h6v6h-6zM64 8h4v4h-4zM8 40h6v4H8zM22 40h4v4h-4zM34 40h6v4h-6zM48 40h4v4h-4zM60 40h6v4h-6zM76 40h4v4h-4zM10 52h4v6h-4zM24 52h6v6h-6zM40 52h4v6h-4zM54 52h6v6h-6zM68 52h4v6h-4zM84 52h6v6h-6zM40 66h6v4h-6zM52 66h4v4h-4zM66 66h6v4h-6zM80 66h4v4h-4zM40 80h4v6h-4zM54 80h6v6h-6zM66 80h4v6h-4zM80 80h6v6h-6z"/></svg></div>
      <h3>Hysteria2</h3>
      <p class="small muted">когда сеть мешает</p>
      <button class="btn" style="padding:8px 15px;font-size:12.5px">Скопировать ключ</button>
    </div>
    <div class="qr-card">
      <div class="qr-box"><svg viewBox="0 0 100 100" fill="#101418"><rect x="4" y="4" width="24" height="24" rx="3"/><rect x="72" y="4" width="24" height="24" rx="3"/><rect x="4" y="72" width="24" height="24" rx="3"/><rect x="10" y="10" width="12" height="12" fill="#fff" rx="1.5"/><rect x="78" y="10" width="12" height="12" fill="#fff" rx="1.5"/><rect x="10" y="78" width="12" height="12" fill="#fff" rx="1.5"/><path d="M38 10h6v4h-6zM48 10h4v6h-4zM60 10h6v4h-6zM36 22h4v4h-4zM8 36h4v6H8zM18 36h6v6h-6zM30 36h4v6h-4zM42 36h6v6h-6zM54 36h4v6h-4zM66 36h6v6h-6zM80 36h4v6h-4zM8 48h6v4H8zM20 48h4v4h-4zM36 48h4v4h-4zM48 48h6v4h-6zM60 48h4v4h-4zM72 48h6v4h-6zM36 60h6v6h-6zM48 60h4v6h-4zM60 60h6v6h-6zM72 60h4v6h-4zM36 72h4v4h-4zM48 72h6v4h-6zM60 72h4v4h-4zM72 72h6v4h-6zM84 48h4v4h-4zM84 60h6v6h-6zM84 72h4v4h-4z"/></svg></div>
      <h3>AmneziaWG</h3>
      <p class="small muted">тихий · для жёстких сетей</p>
      <button class="btn" style="padding:8px 15px;font-size:12.5px">Скачать .conf</button>
    </div>
  </div>
  <div class="links-row">
    <button class="btn btn-ghost">Инструкции по приложениям</button>
    <button class="btn btn-ghost">Сбросить ключи</button>
  </div>
</div>
</body>
</html>
